databaseChangeLog:
  - changeSet:
      id: 1781265600000-1
      author: codex
      changes:
        - createTable:
            tableName: water_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_water_logs
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: request_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount_ml
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: record_date
                  type: DATE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: water_logs
            columnNames: user_id, request_id
            constraintName: uc_water_logs_user_request
        - createIndex:
            tableName: water_logs
            indexName: idx_water_logs_user_date
            columns:
              - column:
                  name: user_id
              - column:
                  name: record_date
              - column:
                  name: created_at
                  descending: true
  - changeSet:
      id: 1781265600000-2
      author: codex
      changes:
        - createTable:
            tableName: water_templates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_water_templates
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: amount_ml
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: water_templates
            columnNames: user_id, amount_ml
            constraintName: uc_water_templates_user_amount
